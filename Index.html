<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Deals - Admin Chat</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fb;
  height:100vh;
  overflow:hidden;
}

.header{
  height:60px;
  background:#1769e0;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.header h2{
  font-size:20px;
}

.header span{
  font-size:12px;
  opacity:.9;
}

.app{
  height:calc(100vh - 60px);
  display:flex;
}

/* CHAT LIST */

.chat-list{
  width:320px;
  background:white;
  border-right:1px solid #ddd;
  overflow-y:auto;
}

.list-title{
  padding:15px;
  font-weight:bold;
  border-bottom:1px solid #eee;
}

.chat-item{
  padding:14px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.chat-item:hover{
  background:#f4f7fb;
}

.chat-item.active{
  background:#e9f1ff;
  border-left:4px solid #1769e0;
}

.chat-name{
  font-weight:bold;
  color:#222;
}

.chat-phone{
  font-size:12px;
  color:#777;
  margin-top:4px;
}

.last-message{
  font-size:13px;
  color:#777;
  margin-top:7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-time{
  font-size:10px;
  color:#999;
  margin-top:5px;
}

/* CHAT AREA */

.chat-area{
  flex:1;
  display:flex;
  flex-direction:column;
  background:#f7f9fc;
}

.empty{
  margin:auto;
  text-align:center;
  color:#777;
}

.empty h2{
  margin-bottom:8px;
}

/* CUSTOMER HEADER */

.customer-header{
  background:white;
  padding:13px 18px;
  border-bottom:1px solid #ddd;
}

.customer-header strong{
  font-size:16px;
}

.customer-header small{
  display:block;
  color:#777;
  margin-top:3px;
}

/* MESSAGES */

#messages{
  flex:1;
  overflow-y:auto;
  padding:18px;
}

.message{
  max-width:75%;
  padding:10px 13px;
  margin:7px 0;
  border-radius:12px;
  font-size:14px;
  line-height:1.4;
  word-wrap:break-word;
}

.customer{
  background:#e6eaf0;
  color:#222;
  margin-right:auto;
  border-bottom-left-radius:3px;
}

.admin{
  background:#1769e0;
  color:white;
  margin-left:auto;
  border-bottom-right-radius:3px;
}

.time{
  display:block;
  font-size:10px;
  opacity:.7;
  margin-top:4px;
  text-align:right;
}

/* SEND AREA */

.send-area{
  background:white;
  border-top:1px solid #ddd;
  padding:10px;
  display:flex;
  gap:8px;
}

#messageInput{
  flex:1;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  font-size:14px;
  outline:none;
}

#messageInput:focus{
  border-color:#1769e0;
}

#sendBtn{
  width:90px;
  border:none;
  border-radius:10px;
  background:#1769e0;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#sendBtn:disabled{
  background:#aaa;
}

/* STATUS */

.status{
  padding:8px 15px;
  background:white;
  border-top:1px solid #eee;
  font-size:12px;
  color:#777;
  text-align:center;
}

/* MOBILE */

.back-btn{
  display:none;
  margin-right:10px;
  border:none;
  background:none;
  font-size:20px;
  cursor:pointer;
}

@media(max-width:700px){

  .chat-list{
    width:100%;
  }

  .chat-area{
    display:none;
  }

  .app.chat-open .chat-list{
    display:none;
  }

  .app.chat-open .chat-area{
    display:flex;
  }

  .back-btn{
    display:inline-block;
  }

}
</style>
</head>

<body>

<div class="header">
  <h2>Smart Deals Admin</h2>
  <span>Live Support</span>
</div>

<div class="app" id="app">

  <!-- CHAT LIST -->

  <div class="chat-list">

    <div class="list-title">
      Customer Chats
    </div>

    <div id="chatList">
      <div style="padding:20px;text-align:center;color:#777;">
        Chats load हो रही हैं...
      </div>
    </div>

  </div>


  <!-- CHAT AREA -->

  <div class="chat-area">

    <div class="empty" id="emptyChat">
      <h2>💬 Customer Chat</h2>
      <p>Customer की chat खोलने के लिए उसे select करें।</p>
    </div>


    <div id="activeChat"
         style="display:none;height:100%;flex-direction:column;">

      <div class="customer-header">

        <button class="back-btn" id="backBtn">
          ←
        </button>

        <strong id="customerName">
          Customer
        </strong>

        <small id="customerInfo"></small>

      </div>


      <div id="messages"></div>


      <div class="send-area">

        <input
          type="text"
          id="messageInput"
          placeholder="Reply लिखें..."
          autocomplete="off"
        >

        <button id="sendBtn">
          Send
        </button>

      </div>

      <div class="status" id="status">
        Ready
      </div>

    </div>

  </div>

</div>


<script type="module">

/* ==========================================
   FIREBASE SDK
========================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  addDoc,
  setDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyDhxguIh_oSvRF0DqKKXO3frzQV0haYeGo",

  authDomain:
  "smart-deals-99646.firebaseapp.com",

  projectId:
  "smart-deals-99646",

  storageBucket:
  "smart-deals-99646.firebasestorage.app",

  messagingSenderId:
  "778513438968",

  appId:
  "1:778513438968:web:ac20adc60ff63edd42830d"

};


/* ==========================================
   INITIALIZE FIREBASE
========================================== */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* ==========================================
   ELEMENTS
========================================== */

const appBox =
document.getElementById("app");

const chatList =
document.getElementById("chatList");

const emptyChat =
document.getElementById("emptyChat");

const activeChat =
document.getElementById("activeChat");

const customerName =
document.getElementById("customerName");

const customerInfo =
document.getElementById("customerInfo");

const messages =
document.getElementById("messages");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const backBtn =
document.getElementById("backBtn");

const statusBox =
document.getElementById("status");


/* ==========================================
   VARIABLES
========================================== */

let currentChatId = null;

let unsubscribeMessages = null;


/* ==========================================
   LOAD CUSTOMER CHATS
========================================== */

const chatsQuery = query(
  collection(db,"chats"),
  orderBy("updatedAt","desc")
);


onSnapshot(
  chatsQuery,

  (snapshot) => {

    chatList.innerHTML = "";


    if(snapshot.empty){

      chatList.innerHTML = `
        <div style="
          padding:20px;
          text-align:center;
          color:#777;
        ">
          अभी कोई customer chat नहीं है।
        </div>
      `;

      return;
    }


    snapshot.forEach((chatDoc) => {

      const data =
      chatDoc.data();


      const item =
      document.createElement("div");

      item.className =
      "chat-item";


      if(chatDoc.id === currentChatId){

        item.classList.add("active");

      }


      const name =
      data.name || "Unknown Customer";

      const phone =
      data.phone || "";

      const lastMessage =
      data.lastMessage || "New Chat";


      let time = "";


      if(data.updatedAt){

        try{

          time =
          data.updatedAt
          .toDate()
          .toLocaleString(
            "hi-IN",
            {
              day:"2-digit",
              month:"short",
              hour:"2-digit",
              minute:"2-digit"
            }
          );

        }catch(error){

          time = "";

        }

      }


      item.innerHTML = `

        <div class="chat-name">
          ${escapeHTML(name)}
        </div>

        <div class="chat-phone">
          ${escapeHTML(phone)}
        </div>

        <div class="last-message">
          ${escapeHTML(lastMessage)}
        </div>

        <div class="chat-time">
          ${escapeHTML(time)}
        </div>

      `;


      item.addEventListener(
        "click",
        () => {

          openChat(
            chatDoc.id,
            data
          );

        }
      );


      chatList.appendChild(item);

    });

  },

  (error) => {

    console.error(
      "CHAT LIST ERROR:",
      error
    );


    chatList.innerHTML = `
      <div style="
        padding:20px;
        color:#dc2626;
      ">
        Chats load नहीं हो सकीं।
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

  }

);


/* ==========================================
   OPEN CHAT
========================================== */

function openChat(
  chatId,
  data
){

  currentChatId =
  chatId;


  emptyChat.style.display =
  "none";


  activeChat.style.display =
  "flex";


  customerName.textContent =
  data.name || "Customer";


  let info = "";

  if(data.phone){

    info += data.phone;

  }

  if(data.email){

    if(info) info += " • ";

    info += data.email;

  }


  customerInfo.textContent =
  info;


  appBox.classList.add(
    "chat-open"
  );


  statusBox.textContent =
  "Connected";


  listenMessages(
    chatId
  );


  messageInput.focus();

}


/* ==========================================
   LOAD MESSAGES
========================================== */

function listenMessages(
  chatId
){

  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages =
    null;

  }


  messages.innerHTML = `
    <div style="
      text-align:center;
      color:#777;
      padding:20px;
    ">
      Messages load हो रहे हैं...
    </div>
  `;


  const messagesRef =
  collection(
    db,
    "chats",
    chatId,
    "messages"
  );


  const messagesQuery =
  query(
    messagesRef,
    orderBy(
      "createdAt",
      "asc"
    )
  );


  unsubscribeMessages =
  onSnapshot(

    messagesQuery,

    (snapshot) => {

      messages.innerHTML = "";


      if(snapshot.empty){

        messages.innerHTML = `
          <div style="
            text-align:center;
            color:#777;
            padding:20px;
          ">
            अभी कोई message नहीं है।
          </div>
        `;

        return;

      }


      snapshot.forEach(
        (messageDoc) => {

          const data =
          messageDoc.data();


          const div =
          document.createElement("div");


          if(data.sender === "admin"){

            div.className =
            "message admin";

          }else{

            div.className =
            "message customer";

          }


          const text =
          document.createElement("div");


          text.textContent =
          data.text || "";


          const time =
          document.createElement("span");


          time.className =
          "time";


          if(data.createdAt){

            try{

              time.textContent =
              data.createdAt
              .toDate()
              .toLocaleTimeString(
                "hi-IN",
                {
                  hour:"2-digit",
                  minute:"2-digit"
                }
              );

            }catch(error){

              time.textContent = "";

            }

          }


          div.appendChild(
            text
          );

          div.appendChild(
            time
          );


          messages.appendChild(
            div
          );

        }
      );


      messages.scrollTop =
      messages.scrollHeight;

    },

    (error) => {

      console.error(
        "MESSAGE LIST ERROR:",
        error
      );


      messages.innerHTML = `
        <div style="
          color:#dc2626;
          padding:20px;
          text-align:center;
        ">
          Messages load नहीं हो सके।
          <br><br>
          ${escapeHTML(error.message)}
        </div>
      `;

    }

  );

}


/* ==========================================
   SEND ADMIN MESSAGE
========================================== */

async function sendMessage(){

  const text =
  messageInput.value.trim();


  if(!text){

    return;

  }


  if(!currentChatId){

    statusBox.textContent =
    "पहले customer की chat select करें।";

    return;

  }


  sendBtn.disabled =
  true;

  sendBtn.textContent =
  "Sending...";


  statusBox.textContent =
  "Message भेजा जा रहा है...";


  try{

    /* CREATE MESSAGE */

    await addDoc(

      collection(
        db,
        "chats",
        currentChatId,
        "messages"
      ),

      {

        text: text,

        sender: "admin",

        createdAt:
        serverTimestamp()

      }

    );


    /* UPDATE CHAT */

    await setDoc(

      doc(
        db,
        "chats",
        currentChatId
      ),

      {

        lastMessage:
        text,

        updatedAt:
        serverTimestamp()

      },

      {

        merge:true

      }

    );


    messageInput.value =
    "";


    statusBox.textContent =
    "Message sent ✓";


    messageInput.focus();


  }catch(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );


    statusBox.textContent =
    "Message send नहीं हुआ: " +
    error.message;


    alert(
      "Message send नहीं हुआ।\n\n" +
      error.message
    );

  }


  sendBtn.disabled =
  false;

  sendBtn.textContent =
  "Send";

}


/* ==========================================
   SEND BUTTON
========================================== */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* ==========================================
   ENTER TO SEND
========================================== */

messageInput.addEventListener(
  "keydown",
  (event) => {

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* ==========================================
   MOBILE BACK
========================================== */

backBtn.addEventListener(
  "click",
  () => {

    appBox.classList.remove(
      "chat-open"
    );


    currentChatId =
    null;


    if(unsubscribeMessages){

      unsubscribeMessages();

      unsubscribeMessages =
      null;

    }


    activeChat.style.display =
    "none";


    emptyChat.style.display =
    "block";

  }
);


/* ==========================================
   HTML SECURITY
========================================== */

function escapeHTML(
  value
){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>

</body>
</html>
